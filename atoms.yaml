# lib-error atom spec (P-013/T-151) — Error-raising primitive — native impls in the lib-error crate (`error_op_registry`); impl keys are the `handle ... with` hints (rust_ prefix dropped).
# `sig` = handl signature (~> canonical), `impl` = key for the
# module's impl table, `total` replaces `guarantee: True` decl
# clauses. This file IS the spec (the cap/op/handle decl triples were
# stripped from src/index.hnl in the T-151 migration); the `impl:`
# keys resolve against the host's `error_impls` table in
# plugin-lib-stdlib `ops/kernel_impls.rs).
module: error
atoms:
  - name: error.raise
    sig: "Value ~> a"
    impl: error_raise
  - name: error.try
    sig: "Fn ~> Value"
    impl: error_try
